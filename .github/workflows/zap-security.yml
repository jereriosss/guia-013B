name: ZAP Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  zap_scan:
    name: Scan the web application
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Permiso para publicar en Security -> Code scanning
      contents: read         # Permiso para clonar el repositorio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar la App con Docker Compose
        run: |
          docker compose up -d --build
          # Esperar a que la app esté lista antes de escanear
          sleep 30
          # El contenedor de ZAP escribe como un usuario interno distinto al del runner
          mkdir -p reports
          chmod -R a+rwx reports

      - name: ZAP Scan (Automation Framework)
        uses: zaproxy/action-af@v0.3.0
        with:
          plan: '.zap/zap-plan.yml'
          cmd_options: '-port 8090'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          docker_env_vars: |
            APP_USER
            APP_PASSWORD

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: reports/
          retention-days: 7

      - name: Normalizar URIs en SARIF
        if: always()
        run: |
          if [ -f reports/zap-report.sarif.json ]; then
            sed -i 's|"uri": "http://[^"]*|"uri": "docker-compose.yml|g' reports/zap-report.sarif.json
            sed -i 's|"uri": "https://[^"]*|"uri": "docker-compose.yml|g' reports/zap-report.sarif.json
          fi

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/zap-report.sarif.json
          category: zap-scan

