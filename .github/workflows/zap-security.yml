name: ZAP Security Scan
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

  jobs:
    zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar la App con Docker Compose
        run: |
          docker compose up -d --build
          # Esperar a que la app esté lista antes de escanear
          sleep 30
          # El contenedor de ZAP escribe como un usuario interno distinto al del runner
          mkdir -p reports
          chmod -R a+rwx reports

      - name: ZAP Scan (Automation Framework)
        uses: zaproxy/action-af@v0.3.0 # Acción oficial para AF
        with:
          plan: '.zap/zap-plan.yml' # El plan creado en el Paso 1
          cmd_options: '-port 8090'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          # Pasar secretos al contenedor de forma segura
          docker_env_vars: |
            APP_USER
            APP_PASSWORD

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: reports/ # Carpeta donde el job 'report' guardó el HTML
          retention-days: 7
